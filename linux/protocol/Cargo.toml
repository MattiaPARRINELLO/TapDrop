[package]
name = "tapdrop-protocol"
version = "0.1.0"
edition = "2021"
description = "The TapDrop wire protocol: frames, crypto, pairing, batches and the light key"
license = "MIT"
repository = "https://github.com/MattiaPARRINELLO/TapDrop"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
hkdf = "0.12"
hmac = "0.12"
mime_guess = "2"
p256 = { version = "0.13", features = ["ecdh", "pkcs8", "std"] }
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util"] }
uuid = { version = "1", features = ["v4"] }
