[package]
name = "tapdrop-linux"
version = "0.1.0"
edition = "2021"
description = "Hôte Linux pour TapDrop : recevez ce que votre téléphone Android envoie, sans câble"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
dirs = "6"
gtk4 = "0.11.5"
gtk4-layer-shell = "0.9.0"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ksni = { version = "0.3.7", features = ["tokio"] }
mdns-sd = "0.13"
mime_guess = "2"
p256 = { version = "0.13", features = ["ecdh", "pkcs8", "std"] }
pangocairo = "0.22.9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
v4l = "0.14.0"

[profile.release]
lto = true
strip = true
